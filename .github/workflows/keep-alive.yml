name: Keep-alive (Supabase)

# O Render agora é PAGO (Starter, sempre ligado) desde 25/07/2026 — não hiberna
# mais, então não precisamos mais pingar de 10 em 10 min pra mantê-lo quente.
# O que AINDA precisa de ping é o SUPABASE free, que pausa sozinho após ~7 dias
# sem atividade. O /api/health faz uma consulta real no banco, então um ping a
# cada 6h já mantém o Supabase acordado com folga de sobra.
# Obs.: o monitoramento de uptime/alerta fica por conta do UptimeRobot (que
# pinga /health à parte). Este workflow é só o "não deixa o banco dormir".

on:
  schedule:
    - cron: "0 */6 * * *"  # a cada 6h — mantém só o Supabase acordado
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          curl --fail --silent --show-error \
            --max-time 120 --retry 3 --retry-delay 30 --retry-all-errors \
            https://inksa-auth-flask-dev.onrender.com/api/health
          echo "Ping OK"
